<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTP Email Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-wide">
    <header>
      <div class="header-row">
        <div>
          <h1>RTP Email Generator</h1>
          <p class="subtitle">Generate thesis-driven outreach emails in bulk</p>
        </div>
        <div class="header-actions">
          <div class="template-selector">
            <label for="templateSelect">Template:</label>
            <select id="templateSelect"></select>
          </div>
        </div>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="addRowBtn" class="btn btn-small btn-outline">+ Add Row</button>
        <button id="add10RowsBtn" class="btn btn-small btn-outline">+ Add 10 Rows</button>
        <label class="btn btn-small btn-outline csv-upload-label">
          Upload CSV
          <input type="file" id="csvUpload" accept=".csv" style="display:none;">
        </label>
        <button id="downloadTemplateBtn" class="btn btn-small btn-outline">Download CSV Template</button>
      </div>
      <div class="toolbar-right">
        <span id="progressText" class="progress-text"></span>
        <button id="generateAllBtn" class="btn btn-small btn-primary">Generate All Emails</button>
        <button id="draftAllBtn" class="btn btn-small btn-secondary" style="display:none;">Draft All</button>
        <button id="sendAllBtn" class="btn btn-small btn-danger" style="display:none;">Send All</button>
      </div>
    </div>

    <!-- Bulk Table -->
    <div class="table-wrapper">
      <table id="bulkTable">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="selectAll"></th>
            <th class="col-status">Status</th>
            <th class="col-url">Company URL *</th>
            <th class="col-name">Recipient Name</th>
            <th class="col-email">Recipient Email</th>
            <th class="col-subject">Subject Line</th>
            <th class="col-competitors">Competitors</th>
            <th class="col-portfolio">Portfolio Company</th>
            <th class="col-context">Context</th>
            <th class="col-timer">Time</th>
            <th class="col-cost">Cost</th>
            <th class="col-copy">Copy</th>
            <th class="col-outlook">Outlook</th>
            <th class="col-preview">Preview</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <!-- Email Preview Modal -->
    <div id="previewModal" class="modal" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="previewTitle">Email Preview</h2>
          <div class="modal-header-actions">
            <span id="editIndicator" class="edit-indicator" style="display:none;">Edited</span>
            <button id="closeModal" class="btn btn-small btn-outline">Close</button>
          </div>
        </div>
        <div class="editor-toolbar" id="editorToolbar">
          <button type="button" class="toolbar-btn" data-cmd="bold" title="Bold"><strong>B</strong></button>
          <button type="button" class="toolbar-btn" data-cmd="italic" title="Italic"><em>I</em></button>
          <button type="button" class="toolbar-btn" data-cmd="underline" title="Underline"><u>U</u></button>
          <span class="toolbar-sep"></span>
          <button type="button" class="toolbar-btn" data-cmd="undo" title="Undo">&#x21a9;</button>
          <button type="button" class="toolbar-btn" data-cmd="redo" title="Redo">&#x21aa;</button>
        </div>
        <div id="previewBody" class="email-preview" contenteditable="true"></div>
        <div class="modal-actions">
          <button id="modalSaveBtn" class="btn btn-primary" style="display:none;">Save Edits</button>
          <button id="modalOutlookBtn" class="btn btn-outlook">Open in Outlook</button>
          <button id="modalDraftBtn" class="btn btn-secondary">Save as Draft</button>
          <button id="modalSendBtn" class="btn btn-danger">Send Now</button>
          <button id="modalCopyBtn" class="btn btn-outline">Copy HTML</button>
        </div>
      </div>
    </div>

    <div id="statusMessage" class="status-message" style="display:none;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
